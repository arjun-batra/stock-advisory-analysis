name: Hourly watchlist check

# No GitHub `schedule:` trigger on purpose. GitHub's cron is best-effort and was
# silently DROPPING most scheduled ticks (issue #4), so scheduling now lives in
# Supabase pg_cron, which calls this workflow via the workflow_dispatch API on a
# reliable */30 13-21 UTC, Mon-Fri cadence (function public.dispatch_github_workflow).
# This file only defines workflow_dispatch; run_hourly.py still does the precise
# America/New_York market-open gate, so off-hours/holiday dispatches just no-op.

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run even if the market is closed (testing/backfill)"
        type: boolean
        default: false
      alerts_enabled:
        description: "Send real pushes? Set false for a safe off-hours dry run"
        type: boolean
        default: true

# Serialize runs so two never mutate verdict_state at once (design 7.4).
concurrency:
  group: hourly-watchlist
  cancel-in-progress: false

jobs:
  watchlist:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly watchlist check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Repository variables (Settings -> Secrets and variables -> Actions ->
          # Variables tab), not secrets -- model names aren't sensitive, and this
          # way you can swap models from the GitHub UI with no commit. GEMINI_MODEL
          # keeps a literal default (the primary must never be empty). The BACKUP,
          # however, carries NO literal default on purpose: an unset Variable ->
          # empty env -> config.py's `if m` filter drops it -> NO fallback model.
          # That is exactly config.py's documented "leave empty to disable the
          # fallback" behavior. So: BACKUP Variable unset means NO backup model,
          # NOT a silent 'gemini-2.5-flash-lite' fallback.
          # Literal fallback corrected 3.5/3.1 -> 2.5 family (2026-07-13 change
          # request, Change 2 / design §4.4): the 3.x models showed stability
          # issues; real operation and scripts/config.py's own defaults are on
          # gemini-2.5-flash across every track.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_MODEL_BACKUP: ${{ vars.GEMINI_MODEL_BACKUP }}
          # NSE watchlist model pair (design §12 D3) — same Variable-driven
          # pattern, own free-tier quota bucket. Unset NSE_GEMINI_MODEL -> falls
          # back to the US/TSX primary (NSE runs in a separate, non-overlapping
          # session). NSE_GEMINI_MODEL_BACKUP unset AND GEMINI_MODEL_BACKUP unset
          # -> empty -> config drops it -> no NSE backup, same disable-by-unset
          # behavior as above (no literal lite fallback).
          NSE_GEMINI_MODEL: ${{ vars.NSE_GEMINI_MODEL || vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NSE_GEMINI_MODEL_BACKUP: ${{ vars.NSE_GEMINI_MODEL_BACKUP || vars.GEMINI_MODEL_BACKUP }}
          # Gemini transport tuning: retry count / backoff base / per-attempt
          # timeout. Plain `${{ vars.X }}` with NO literal fallback on purpose:
          # an unset Variable arrives as an empty string and config.py's
          # `or`-default resolves it (3 retries, 10000 ms base with full
          # jitter, 180000 ms timeout); the effective values are logged at
          # call setup. Retry itself lives in ai_judge._generate, shared by
          # the production and shadow tracks.
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES }}
          GEMINI_RETRY_BASE_MS: ${{ vars.GEMINI_RETRY_BASE_MS }}
          GEMINI_TIMEOUT_MS: ${{ vars.GEMINI_TIMEOUT_MS }}
          # Live alerting by default. A manual workflow_dispatch can set
          # alerts_enabled=false for a safe dry run (DryRunNotifier logs the
          # composed push instead of sending it). Scheduled pg_cron dispatches
          # send NO inputs, so the input default (true) applies and live
          # alerting is unchanged. No `|| 'true'` fallback: in GitHub
          # expressions `false || 'true'` is truthy and would defeat the toggle.
          ALERTS_ENABLED: ${{ inputs.alerts_enabled }}
          # Set by the workflow_dispatch toggle; gated (market-open check) when
          # the pg_cron dispatch fires it without inputs.
          FORCE_RUN: ${{ inputs.force_run }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # NSE alerts route here (FR18 / §12 D7). Unset -> notify.py falls back
          # to NTFY_TOPIC, so NSE alerts still land (just not separated yet).
          NSE_NTFY_TOPIC: ${{ secrets.NSE_NTFY_TOPIC }}
          DETAIL_PAGE_BASE: ${{ secrets.DETAIL_PAGE_BASE }}
        run: python scripts/run_hourly.py

      # --- Shadow verdict pilot (US/CA, NON-production) --------------------------
      # Runs as a SEPARATE process AFTER the production step above has already
      # finished and written its rows. Isolation is structural: production is
      # complete before this starts, so a hang/timeout/exception here has no code
      # path back to it. `continue-on-error: true` is the second belt — a shadow
      # failure never fails the workflow run (production already succeeded).
      #
      # Kill switch: default ON for the pilot. Only SHADOW_ENABLED=false (a repo
      # Variable, zero code change) disables it. The `!= 'false'` gate means unset
      # -> '' != 'false' -> step runs; this is NOT a `|| 'true'` default, so it
      # can't be defeated by GitHub-expression truthiness (the empty default is
      # resolved in config.py, not here). Reuses the SAME model-call config vars
      # as production (GEMINI_MODEL / _BACKUP / timeout); no NTFY_* passed — this
      # track never alerts.
      - name: Run shadow verdict track (US/CA pilot)
        if: ${{ vars.SHADOW_ENABLED != 'false' }}
        continue-on-error: true
        # Hang isolation belt (INC-1 hardening, design §16.4/load-bearing #11):
        # bounds a stuck step instead of holding the runner and delaying the NSE
        # shadow step that runs after it. Chosen well under the workflow's
        # overall runner budget; a hang here fails only this step
        # (continue-on-error), never the run.
        # REV-015: promoted to a shared repo Variable (design §9) so the bound
        # can be raised without a commit as NSE batches grow; `fromJSON` coerces
        # the Variable's string to the number `timeout-minutes` requires.
        timeout-minutes: ${{ fromJSON(vars.SHADOW_TIMEOUT_MINUTES || '15') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_MODEL_BACKUP: ${{ vars.GEMINI_MODEL_BACKUP }}
          # Same transport tuning as the production step above — the retry loop
          # is the SAME shared function (ai_judge._generate), and passing the
          # same Variables keeps track parity. Unset -> empty -> code defaults.
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES }}
          GEMINI_RETRY_BASE_MS: ${{ vars.GEMINI_RETRY_BASE_MS }}
          GEMINI_TIMEOUT_MS: ${{ vars.GEMINI_TIMEOUT_MS }}
          # Empty/unset Variable -> config.py resolves the pilot default (on).
          # Setting it to 'false' turns the whole track off with no code change.
          SHADOW_ENABLED: ${{ vars.SHADOW_ENABLED }}
          # Same market-open gate as production; a force-run dispatch runs the
          # shadow track too (against the same forced production snapshot).
          FORCE_RUN: ${{ inputs.force_run }}
        run: python scripts/run_shadow.py

      # --- NSE shadow verdict pilot (NSE, NON-production, design §16) ------------
      # A second, fully independent shadow track from the US/CA one above: own
      # table (call_log_shadow_nse), own kill switch (SHADOW_NSE_ENABLED), NSE
      # market-hours gating, NSE's own model bucket. Runs as a SEPARATE process
      # STRICTLY AFTER both the production step and the US/CA shadow step above,
      # so a hang/exception here has no code path back to either of them
      # (FR37/NFR6, load-bearing #11). `continue-on-error: true` +
      # `timeout-minutes` are the same two belts as the US/CA shadow step; no
      # NTFY_* vars are passed at all — this track never alerts (FR36).
      # REV-015: shares the same SHADOW_TIMEOUT_MINUTES Variable as the US/CA
      # shadow step above — one generic runner-hang guard for both tracks.
      - name: Run NSE shadow verdict track (NSE pilot)
        if: ${{ vars.SHADOW_NSE_ENABLED != 'false' }}
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(vars.SHADOW_TIMEOUT_MINUTES || '15') }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # NSE's own model bucket (design §16.2) — same vars production's NSE
          # group already passes, reused rather than a third model-Variable pair.
          NSE_GEMINI_MODEL: ${{ vars.NSE_GEMINI_MODEL || vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          NSE_GEMINI_MODEL_BACKUP: ${{ vars.NSE_GEMINI_MODEL_BACKUP || vars.GEMINI_MODEL_BACKUP }}
          # Same transport tuning as production/US-CA-shadow — shared retry
          # function (ai_judge._generate). Unset -> empty -> code defaults.
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES }}
          GEMINI_RETRY_BASE_MS: ${{ vars.GEMINI_RETRY_BASE_MS }}
          GEMINI_TIMEOUT_MS: ${{ vars.GEMINI_TIMEOUT_MS }}
          # Empty/unset Variable -> config.py resolves the pilot default (on).
          # Independent of SHADOW_ENABLED (FR38) — setting THIS to 'false' turns
          # off only the NSE track, with no code change and no effect on US/CA.
          SHADOW_NSE_ENABLED: ${{ vars.SHADOW_NSE_ENABLED }}
          SHADOW_NSE_PROMPT_VARIANT: ${{ vars.SHADOW_NSE_PROMPT_VARIANT }}
          SHADOW_NSE_SNAPSHOT_LOOKBACK_MIN: ${{ vars.SHADOW_NSE_SNAPSHOT_LOOKBACK_MIN }}
          # Same market-open gate (NSE) as production; a force-run dispatch runs
          # the NSE shadow track too (against the same forced production snapshot).
          FORCE_RUN: ${{ inputs.force_run }}
          # Deliberately NO NTFY_TOPIC / NSE_NTFY_TOPIC / DETAIL_PAGE_BASE — this
          # track never alerts (FR36) and has no dashboard read path (FR35).
        run: python scripts/run_shadow_nse.py
