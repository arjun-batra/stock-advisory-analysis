name: Hourly watchlist check

# No GitHub `schedule:` trigger on purpose. GitHub's cron is best-effort and was
# silently DROPPING most scheduled ticks (issue #4), so scheduling now lives in
# Supabase pg_cron, which calls this workflow via the workflow_dispatch API on a
# reliable */30 13-21 UTC, Mon-Fri cadence (function public.dispatch_github_workflow).
# This file only defines workflow_dispatch; run_hourly.py still does the precise
# America/New_York market-open gate, so off-hours/holiday dispatches just no-op.

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run even if the market is closed (testing/backfill)"
        type: boolean
        default: false
      alerts_enabled:
        description: "Send real pushes? Set false for a safe off-hours dry run"
        type: boolean
        default: true

# NOTE (INC-6/FR30, REV-040b): permissions is intentionally declared per-job
# below, NOT here at the workflow top level -- this workflow holds every
# production secret and a top-level `permissions: contents: write` would
# apply to any job this file will ever contain, including one added later
# without necessarily re-auditing this decision. A previous Pass-11 fix
# (REV-050) had added a top-level `contents: read` here; INC-6 supersedes it
# with the job-scoped block below, which is stricter (no job inherits write
# by default) and matches this file's real single-job shape today.

# Serialize runs so two never mutate verdict_state at once (design 7.4).
# RENAMED (REV-040a, INC-6/FR30) from `hourly-watchlist` to a group shared
# with publish-prices.yml, so their commit-on-change steps (both hit
# tunables_cache.json / pages/prices.json on overlapping */30 windows) can
# never race against each other. This only ADDS publish-prices.yml to the
# same FIFO queue -- two hourly-watchlist.yml runs still serialize against
# each other exactly as before, preserving the original verdict_state
# guarantee this group existed for.
concurrency:
  group: repo-commit
  cancel-in-progress: false

jobs:
  watchlist:
    permissions:
      contents: write   # NEW (REV-040b, INC-6/FR30) -- scoped to THIS JOB only, needed for the
                         # "Commit tunables cache if changed" step below. The rest of the workflow's
                         # default token permissions are untouched.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly watchlist check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          # Model names are NOT wired here (REV-039/REV-038): scripts/config.py is
          # the single source of truth for GEMINI_MODEL / GEMINI_MODEL_BACKUP /
          # NSE_GEMINI_MODEL / NSE_GEMINI_MODEL_BACKUP, including NSE's inheritance
          # of the US/TSX pair when unset. A workflow `env:` line set to an unset
          # `${{ vars.X }}` arrives as an EMPTY STRING, not an absent key, which
          # would defeat config.py's two-arg `os.environ.get(name, default)` and
          # silently blank the model — so no env line is passed for these four
          # keys, and config.py's own defaults/inheritance apply unconditionally.
          # To override a model, edit scripts/config.py (until the admin-portal
          # tunables table replaces this mechanism).
          # Gemini transport tuning: retry count / backoff base / per-attempt
          # timeout. Plain `${{ vars.X }}` with NO literal fallback on purpose:
          # an unset Variable arrives as an empty string and config.py's
          # `or`-default resolves it (3 retries, 10000 ms base with full
          # jitter, 180000 ms timeout); the effective values are logged at
          # call setup. Retry itself lives in ai_judge._generate, shared by
          # the production track.
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES }}
          GEMINI_RETRY_BASE_MS: ${{ vars.GEMINI_RETRY_BASE_MS }}
          GEMINI_TIMEOUT_MS: ${{ vars.GEMINI_TIMEOUT_MS }}
          # Live alerting by default. A manual workflow_dispatch can set
          # alerts_enabled=false for a safe dry run (DryRunNotifier logs the
          # composed push instead of sending it). Scheduled pg_cron dispatches
          # send NO inputs, so the input default (true) applies and live
          # alerting is unchanged. No `|| 'true'` fallback: in GitHub
          # expressions `false || 'true'` is truthy and would defeat the toggle.
          ALERTS_ENABLED: ${{ inputs.alerts_enabled }}
          # Set by the workflow_dispatch toggle; gated (market-open check) when
          # the pg_cron dispatch fires it without inputs.
          FORCE_RUN: ${{ inputs.force_run }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # NSE alerts route here (FR18 / §12 D7). Unset -> notify.py falls back
          # to NTFY_TOPIC, so NSE alerts still land (just not separated yet).
          NSE_NTFY_TOPIC: ${{ secrets.NSE_NTFY_TOPIC }}
          DETAIL_PAGE_BASE: ${{ secrets.DETAIL_PAGE_BASE }}
        run: python scripts/run_hourly.py

      # FR30 / Decision #28-#29: this workflow is the SOLE writer of
      # tunables_cache.json (config.write_tunables_cache_if_fetched(), called
      # from run_hourly.py's main() above). Not a verbatim copy of publish-
      # prices.yml's "Commit prices.json if changed" step (REV-040): guarded
      # by the shared `repo-commit` concurrency group above (primary defense),
      # plus a bounded retry around the pull-rebase-then-push pair (REV-040's
      # second mitigation) so a lost race against another committer to this
      # branch fails the push once and retries, rather than failing this step
      # outright AFTER the run's real work (checks, alerts) already succeeded.
      - name: Commit tunables cache if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tunables_cache.json
          if git diff --cached --quiet; then
            echo "tunables_cache.json unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: refresh tunables cache [skip ci]"

          max_attempts=3
          attempt=1
          until git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::failed to push tunables_cache.json after ${max_attempts} attempts"
              exit 1
            fi
            sleep_s=$(( (RANDOM % 5) + 2 ))
            echo "push attempt ${attempt}/${max_attempts} failed (lost the race or a transient error) — retrying in ${sleep_s}s"
            attempt=$((attempt + 1))
            sleep "$sleep_s"
          done
          echo "tunables_cache.json pushed (attempt ${attempt}/${max_attempts})."
